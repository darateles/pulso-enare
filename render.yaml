services:
  - type: web
    name: pulso
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: virginia
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: APP_USER
        value: pulso
      - key: APP_PASSWORD
        generateValue: true
      - key: TRUST_PROXY
        value: 1
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
