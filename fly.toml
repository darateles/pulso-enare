app = "pulso"
primary_region = "gru"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "4175"
  PULSO_DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "pulso_data"
  destination = "/data"

[http_service]
  internal_port = 4175
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
