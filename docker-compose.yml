services:
  pulso:
    build: .
    restart: unless-stopped
    ports:
      - "4175:4175"
    environment:
      HOST: 0.0.0.0
      PORT: 4175
      PULSO_DATA_DIR: /data
      APP_USER: ${APP_USER:-pulso}
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD no .env}
      # Recomendado: openssl rand -hex 32. Sem ele, o servidor deriva da senha.
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUST_PROXY: "1"
    volumes:
      - pulso-data:/data

volumes:
  pulso-data:
